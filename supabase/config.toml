# Isolated development / CI only. Never push this configuration to the pilot.
project_id = "turntally-auth-tests"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/recovery"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# The CLI maps this flag to ExternalEmailEnabled (the entire provider).
# Keep provisioned email sign-in enabled; auth.enable_signup above blocks signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false

[functions.viewer-devices]
# Public start/poll/cancel; the handler verifies Auth itself for other actions.
verify_jwt = false
